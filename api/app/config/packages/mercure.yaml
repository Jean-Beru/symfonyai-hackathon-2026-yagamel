mercure:
    hubs:
        default:
            url: '%env(default::MERCURE_URL)%'
            # The browser subscribes on the origin of the page.
            public_url: '/.well-known/mercure'
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                publish: '*'
                claims:
                    iss: '%env(MERCURE_JWT_ISSUER)%'
                    sub: 'app'
                    client_id: 'app'
